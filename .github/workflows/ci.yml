name: Frontend CI

on:
  push:
    branches:
      - cscwx2-staging
      - main
  pull_request:
    branches:
      - cscwx2-staging
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: ${{ matrix.target }} build
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - staging
          - production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
      - run: npm run verify:${{ matrix.target }}

  browser:
    name: Browser freshness and update checks
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
